<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="hangman.css">
    <script src="hangman.js"></script>
    <title>Document</title>
</head>

<body>
    <div>
        <img id="hangmanpic" src="images/hangman6.gif" alt="Picture of Hangman">
    </div>
    <div id="clue">Press New Game to Play</div>

    <div>
        <input id="guess" type="text" size="1" maxlength="1" disabled>
        <button id="guessbutton" onclick="guess();" disabled>Guess</button>
    </div>
    <div id="newgamearea">
        <button onclick="newGame();">New Game</button>
    </div>
    <div id="guesses">Guessed letters: None yet</div>

</body>

</html>
